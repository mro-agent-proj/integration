name: Check

# 서비스별 테스트는 각 레포 CI가 돌립니다. 여기서는 통합 스크립트와 고정된 데이터·채점 계약을 확인합니다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # submodule 포인터가 각 레포에 실제로 있는 커밋인지 (받아지지 않으면 실패)
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Scripts
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh
      - name: Startup failure regression tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Pinned backend evaluation and seed contract
        run: python3 -m unittest discover -s backend/scripts/tests -v
      - name: Data packages match the pinned backend
        run: bash scripts/check-data-version.sh
      - name: No secrets or dumps committed
        run: |
          ! git ls-files | grep -E '(^|/)\.env(\.mcp)?$|\.dump$|\.tar$'
